services:
  db_v2:
    image: postgres:15-alpine
    container_name: bioequi_postgres_v2
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bioequi_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
      - ./init_v2.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data_v2: