services:
  db:
    image: postgres:15-alpine
    container_name: bioequi_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: bioequi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Esta línea mapea tu script SQL para que se ejecute solo la primera vez que se crea el contenedor
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: